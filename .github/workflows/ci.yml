name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端（typecheck / lint / test）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: "10.11.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Typecheck（strict）
        run: npx tsc --noEmit

      - name: Typecheck plugins
        run: npx tsc -p tsconfig.plugins.json --noEmit

      - name: ESLint
        # TODO(P0): 存量 42 errors（react-hooks/refs 33、purity 4、preserve-manual-memoization 2 等），
        # 集中在 DeskpetPet.tsx / ScreenshotOverlay.tsx / AiWorkflowView.tsx / useAiChat.ts。
        # 清零后删除 continue-on-error，恢复为阻断步骤。
        continue-on-error: true
        run: pnpm lint

      - name: Vitest
        run: pnpm test

  rust:
    name: Rust（check / clippy / test）
    # 项目为 Windows 优先（windows-sys / WinRT / NVML 等），CI 必须在 Windows  runner 上跑。
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        # TODO(P0): 存量 warning（dead code / unused imports 等约 12 处）。
        # 清零后删除 continue-on-error，恢复为 cargo clippy -- -D warnings 阻断。
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        # --features test-manifest：把 comctl32 v6 清单链进测试二进制，
        # 否则测试进程启动即 0xc0000139（muda 静态导入 TaskDialogIndirect，见 build.rs）。
        # --lib：只跑单元测试；不带 feature 时 bin 目标链接会与 tauri 内嵌清单冲突。
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --features test-manifest
