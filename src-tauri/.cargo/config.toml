# Build acceleration config - faster compilation and linking, no runtime impact

[build]
# sccache: compilation cache, incremental builds near-instant after first run
rustc-wrapper = "sccache"

[target.x86_64-pc-windows-msvc]
# Use Rust's bundled LLVM LLD linker instead of MSVC default link.exe
# 2-5x faster linking with LTO enabled
#
# ⚠️ 不要硬编码具体版本号（如 1.95.0）：`rustup update` 后 rustc 会换成新版本，
# 而这里仍指向旧版 rust-lld，target 里也会混着旧版 std/对象文件，最终链接报
# `anon.*.llvm.*` / `std::sys::thread_local...` 未定义符号。
# `stable-x86_64-pc-windows-msvc` 始终指向当前 stable 工具链，跟随 rustup 更新。
linker = "C:/Users/Rosary/.rustup/toolchains/stable-x86_64-pc-windows-msvc/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
