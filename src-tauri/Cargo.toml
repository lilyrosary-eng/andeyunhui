[package]
name = "andeyunhui"
version = "0.1.0"
description = "安得云荟 · 笔记"
authors = ["Rosary"]
edition = "2021"

[lib]
name = "andeyunhui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
# 原生文件拖出 drag 依赖（Windows DoDragDrop）已迁移至 [target.'cfg(windows)'.dependencies]，仅 Windows 编译
tauri-plugin-opener = "=2.5.3"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# 文件系统监听：实现插件/图片目录热插拔（实时检测新增/删除/修改）
# 后端由 notify::recommended_watcher 按编译目标自动选择：
#   - Windows  → ReadDirectoryChangesWatcher（windows-sys 为非特性门控的硬性依赖，始终可用）
#   - macOS    → FSEvents（macos_fsevent，比 kqueue 更稳定、资源占用更低）
#   - Linux    → inotify
# 注意：Windows 原生后端与 features 无关，无需单独开启任何 windows 特性。
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
lofty = "0.24.0"
walkdir = "2"
rayon = "1"
# 局域网传输客户端禁止走系统代理：default-features 含 proxy/system-proxy，会把 LAN 请求路由到
# （可能失效的）系统代理导致「接收可/发送不可」。这里关掉默认特性，仅保留 json + rustls-tls。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# RAG 向量存储后端：bundled 模式从源码编译 SQLite，零外部依赖、跨平台（Windows 构建友好）
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
# .mufurong 内容哈希：判断安装包插件副本是否变化，替代不可靠的「字节大小/mtime」比对
sha2 = "0.10"
# tokio 显式依赖：mcp_service 用 tokio::task::spawn_blocking 在独立线程跑 stdio JSON-RPC
# （tauri 2 内部用 tokio，但应用代码需显式声明才能 use tokio::）
# 传输模块需 net/io-util/macros：UDP 组播发现 + axum HTTP 服务端
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
# 局域网传输（LocalSend v2 兼容）：axum 提供 HTTP 文件传输服务端，futures-util 流式读写大文件
axum = "0.7"
futures-util = "0.3"
tempfile = "3"
mimalloc = "0.1"
epub-parser = "=0.3.4"
ammonia = "4"
pulldown-cmark = "0.12"
encoding_rs = "0.8"
chardetng = "0.1"
# 专业模块「薄荷」工具：以内部依赖包形式独立存在（pro-tools-kit crate）
pro-tools-kit = { path = "../crates/pro-tools-kit" }
# 攻防模块后端：双轨制事件溯源 + AI 常驻推理（gongfang-kit crate）
# 默认 default-features=false，仅编译 kernel 骨架 + commands stub，主二进制零污染
# 启用 `gongfang` feature 时拉入 crawler 等重型依赖
# 一次注入后续无忧：`pnpm tauri dev -- --features gongfang,gongfang-reverse,gongfang-pentest,gongfang-automation,gongfang-gateway` 编译后功能永久可用
gongfang-kit = { path = "../crates/gongfang-kit", default-features = false }
# image / base64 跨平台通用，保留在主 crate
image = "0.25"
base64 = "0.22"
# 以下两依赖仅桌面（非 Android/iOS）需要，已迁移至下方
# [target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]：
#   - arboard：仅被 Windows 版截图模块（screenshot.rs）使用，Android/iOS 走 pal/screenshot.rs 桩，无需编译
#   - rdev：仅被 Windows 版设备监听（device.rs）使用，Android/iOS 走 pal/device.rs 桩，无需编译
# Windows 截图/捕获后端 winapi、windows-capture 已迁移至 [target.'cfg(windows)'.dependencies]，仅 Windows 编译
uuid = { version = "1", features = ["v4"] }
# 原生 Office 文档解析（OOXML = zip + XML），毫秒级、不依赖 Python
zip = "3"
quick-xml = "0.39"
# 原生 PDF 解析（文字 + 图片提取），替代 markitdown
pdf-extract = "0.12"
# pdf-extract 内部使用 lopdf 抽取图片，但对其为私有依赖，这里显式声明以便直接使用
# embed_image 特性提供 xobject::image_from，用于把 OCR 源图写入 PDF
lopdf = { version = "0.42", features = ["embed_image"] }
# 一次性预编译正则（html_to_md 等热路径）
once_cell = "1"
# IDE 内容搜索（命令面板 `#` 模式 / agent grep 工具）：gitignore 感知的并行目录遍历。
# ignore 是 ripgrep 的目录遍历核心（MIT），自动尊重 .gitignore/.ignore/全局 gitignore。
ignore = "0.4"
# IDE 真 PTY 终端 portable-pty 已迁移至 [target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]，
# 仅桌面编译（原因见该段注释）。
# 统一日志门面：release 默认 warn 级别，dev 开 debug；替代散落的 eprintln!
log = "0.4"
env_logger = "0.11"
# 进程内 ffmpeg 编码器（完整 L0：d3d11va→nvenc 零拷贝）
# libloading 运行时加载 avcodec-*.dll / avformat-*.dll / avutil-*.dll
libloading = "0.8"

# Windows 任务栏「正在播放」显示名修正：设置本进程 AUMID + 注册表显示名「安得云荟」，
# 使 WebView2/Chromium 注册的媒体会话显示为「安得云荟」而非「未知应用」。
# 注：本环境 windows crate (0.61/0.62) 的 Media_Control 仅生成会话的传输方法，未生成
# Set*（TrySetMediaPropertiesAsync 等）/GetSessionControls 等写入方法，故无法用 Rust 原生
# 任务栏「正在播放」：在 Rust 进程内创建 WinRT SystemMediaTransportControls 会话
# （正确显示名「安得云荟」+ 响应系统媒体键）。需要 Media/Media_Playback（SMTC 类型）
# 与 Win32_System_WinRT（ISystemMediaTransportControlsInterop / RoGetActivationFactory）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_Security",
  # 阶段二（进程内 GPU RGBA→RGBA 缩放）：D3D11 渲染管线 + 运行时 D3DCompile 需要这些 API
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Foundation",
  # 方案 A（原生 WGC 捕获，wgc_native.rs）：帧池建在自建 D3D11 设备上，同设备 GPU 缩放后只读回
  # 小尺寸 RGBA。需要 WinRT Graphics.Capture + DirectX interop + HMONITOR。
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Graphics_Gdi",
  "Media",
  "Media_Playback",
  "Media_Control",
  "Storage_Streams",
] }
# === 以下为 Windows 专属依赖：经 T0 依赖审计后由 [dependencies] 迁入 [target.'cfg(windows)'.dependencies] ===
# 目的：支撑 Android v1 交叉编译（aarch64-linux-android）—— 这些 crate 仅 Windows 有实现，
# 在 Android/Linux/macOS 目标下若仍无条件声明会导致编译失败。迁入后 Windows 构建行为完全不变。
# 桌面端 Windows 独占功能：截图(EnumWindows/PrintWindow/GDI)、WGC 捕获、DoDragDrop 原生拖出、WebView2 COM 透明窗。
drag = "2.1.1"
winapi = { version = "0.3", features = ["winuser", "wingdi", "processthreadsapi", "shellscalingapi", "dwmapi", "winbase", "objbase", "combaseapi", "jobapi2", "objidl", "unknwnbase", "winerror", "ole2", "wtypes", "minwindef", "windef", "guiddef"] }
windows-capture = "2.0"
# WebView2 COM 透明窗：必须与 wry 内部 webview2-com 同版本（0.38），且实现 windows-core 0.61 的 Interface trait
webview2-com-sys = "0.38"
windows-core-061 = { package = "windows-core", version = "0.61" }

# WebView2 COM 透明窗相关依赖（webview2-com-sys、windows-core 0.61）已迁移至
# [target.'cfg(windows)'.dependencies]，仅 Windows 编译。说明同上：必须与 wry 内部
# webview2-com 同版本（0.38）且实现 windows-core 0.61 的 Interface trait；待 tauri/wry
# 升级 windows 0.62 后一并移除。**无法统一到 0.62**。

# === 以下为「桌面（非 Android/iOS）」专属依赖：经 T2 依赖审计后由 [dependencies] 迁入 ===
# 目的：支撑 Android v1 交叉编译（aarch64-linux-android）—— arboard / rdev 仅依赖 X11/Wayland/Windows
# 系统 API，在 Android 目标下无实现会导致编译失败。二者仅被 Windows 版 screenshot.rs / device.rs 使用，
# 移动端走 pal/ 同名桩，故在 Android/iOS 下不编译、零功能影响。Windows/桌面 Linux/macOS 构建行为不变。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 跨桌面剪贴板（截图写入兜底），仅 Windows 版 screenshot.rs 使用
arboard = "3"
# 桌宠全局设备监听（鼠标/键盘）：被动全局钩子，仅 Windows 版 device.rs 使用
# 0.5.x 的 listen 接受捕获式 FnMut 闭包（可直接 move AppHandle），更简洁
rdev = "0.5"
# IDE 真 PTY 终端：portable-pty（MIT）跨平台 PTY，Windows 走 ConPTY（Win10 1809+ 内置）。
# 读线程通过 app.emit 推流 pty-output:<id> 事件，前端 xterm.js 监听写入（沙箱屏蔽 WebSocket，故走事件桥接）。
# 迁入原因：portable-pty 0.8 的 Unix 后端经 serial → serial-unix → termios 引入，而 termios 0.2
# 仅实现 linux/macos/freebsd/openbsd，无 android 分支，在 aarch64-linux-android 下必然编译失败
# （E0432/E0433，28 errors）。PTY 终端属 IDE 插件（茑萝/ide）本地终端功能，Android v1 五模块
# （笔记/音乐/视频/图片/传输）不涉及；唯一使用者 services/pty_service.rs 已同步加 cfg 门控，
# 其 4 个 #[tauri::command] 仅在桌面二进制 main.rs 注册，移动端不经过该路径。
# Windows/桌面 Linux/macOS 构建行为完全不变。
portable-pty = "0.8"

[features]
# 攻防模块：启用爬虫框架（reqwest 代理池 + 双令牌桶 + EWMA + CDP 隐身 JS）
# 默认不启用，主二进制零污染；构建时 --features gongfang 开启
gongfang = ["gongfang-kit/crawler"]
# 攻防 + 浏览器隐身（chromiumoxide 真实浏览器，较重）
gongfang-browser = ["gongfang-kit/crawler-browser"]
# 攻防 + 逆向框架（L*协议文法 + 卡方加密识别 + petgraph 控制流反混淆）
gongfang-reverse = ["gongfang-kit/reverse"]
# 攻防 + 渗透框架（编码变异 + SSTI 载荷 + 香农熵指纹 + petgraph 攻击拓扑）
gongfang-pentest = ["gongfang-kit/pentest"]
# 攻防 + 自动化测试（贝塞尔轨迹 + 粉红噪声 + SendInput HID 注入 + arc-swap 模板热迁移）
gongfang-automation = ["gongfang-kit/automation"]
# 攻防 + API 网关（代理池 + 流量整形 + arc-swap 策略热交换 + 预测性故障转移）
gongfang-gateway = ["gongfang-kit/gateway"]

[profile.release]
# 全链路优化：跨 crate 内联 + 死代码消除，性能提升 10-20%
lto = true
# 单代码生成单元：允许更激进的内联优化
codegen-units = 1
# 放弃 unwind 表：减小二进制体积约 50%，减少 CPU 分支预测失败
panic = "abort"
# 最高优化等级（3 = 速度优先，s = 体积优先）
opt-level = 3
# 整数溢出检查：debug 默认开启（panic），release 默认关闭（静默回绕）。
# 开启后 dev 与 release 行为一致，避免出现 "dev 正常、release 算出诡异数字" 的难定位 bug；
# 代价是热点数值循环性能下降约 5-10%，但本应用非数值密集型，可接受。
overflow-checks = true
