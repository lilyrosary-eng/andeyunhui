[package]
name = "andeyunhui"
# 版本号唯一真源是 src-tauri/tauri.conf.json（Tauri 打包读它）；此处与 package.json 必须与其保持一致，
# 否则 cargo metadata / 关于页 / 安装包三方对不上。历史包袱：这里长期停在 0.1.0。
version = "2.4.2"
description = "安得云荟 · 笔记"
authors = ["Rosary"]
edition = "2021"

[lib]
name = "andeyunhui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：解锁多 webview（Window::add_child），「网络视频」的内嵌浏览器依赖它。
# 见 src/embedded_browser.rs —— 用它把子 webview 精确铺在面板矩形上，
# 取代旧方案 alwaysOnTop 独立浮窗（遮挡主窗 UI / 不跟随移动 / 尺寸不同步）。
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "unstable"] }
# 原生文件拖出 drag 依赖（Windows DoDragDrop）已迁移至 [target.'cfg(windows)'.dependencies]，仅 Windows 编译
tauri-plugin-opener = "=2.5.3"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# 文件系统监听：实现插件/图片目录热插拔（实时检测新增/删除/修改）
# 后端由 notify::recommended_watcher 按编译目标自动选择：
#   - Windows  → ReadDirectoryChangesWatcher（windows-sys 为非特性门控的硬性依赖，始终可用）
#   - macOS    → FSEvents（macos_fsevent，比 kqueue 更稳定、资源占用更低）
#   - Linux    → inotify
# 注意：Windows 原生后端与 features 无关，无需单独开启任何 windows 特性。
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 资源占用实时监控（CPU/内存/网络）：与主 crate 已通过 pro-tools-kit 间接依赖的版本一致，缓存复用。
sysinfo = "0.30"
chrono = "0.4"
lofty = "0.24.0"
walkdir = "2"
rayon = "1"
# 局域网传输客户端禁止走系统代理：default-features 含 proxy/system-proxy，会把 LAN 请求路由到
# （可能失效的）系统代理导致「接收可/发送不可」。这里关掉默认特性，仅保留 json + rustls-tls。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "multipart"] }
# RAG 向量存储后端：bundled 模式从源码编译 SQLite，零外部依赖、跨平台（Windows 构建友好）
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
# .mufurong 内容哈希：判断安装包插件副本是否变化，替代不可靠的「字节大小/mtime」比对
sha2 = "0.10"
# API Key 等敏感字段落盘加密（AES-256-GCM 机器绑定）：
# 纯 Rust、跨平台（含 Android 交叉编译），scrypt 做密钥派生（参考 deepseek-desktop 方案）
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
# tokio 显式依赖：mcp_service 用 tokio::task::spawn_blocking 在独立线程跑 stdio JSON-RPC
# （tauri 2 内部用 tokio，但应用代码需显式声明才能 use tokio::）
# 传输模块需 net/io-util/macros：UDP 组播发现 + axum HTTP 服务端
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "macros", "process"] }
# Agent 工具 trait 异步化：文件读写授权等待、命令超时需要在 async 上下文中 await
async-trait = "0.1"
# 局域网传输（LocalSend v2 兼容）：axum 提供 HTTP 文件传输服务端，futures-util 流式读写大文件
axum = "0.7"
futures-util = "0.3"
tempfile = "3"
mimalloc = "0.1"
epub-parser = "=0.3.4"
ammonia = "4"
pulldown-cmark = "0.12"
encoding_rs = "0.8"
chardetng = "0.1"
# 专业模块「薄荷」工具：以内部依赖包形式独立存在（pro-tools-kit crate）
pro-tools-kit = { path = "../crates/pro-tools-kit" }
# 攻防模块后端：双轨制事件溯源 + AI 常驻推理（gongfang-kit crate）
# 此处 default-features=false：本 crate 的 feature（见文件末尾 [features]）才是唯一开关，
# 而那组 feature 已默认全开 —— `pnpm tauri dev` / `cargo check` / 构建脚本都不用再加参数。
gongfang-kit = { path = "../crates/gongfang-kit", default-features = false }
# image / base64 跨平台通用，保留在主 crate
image = "0.25"
base64 = "0.22"
# 以下两依赖仅桌面（非 Android/iOS）需要，已迁移至下方
# [target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]：
#   - arboard：仅被 Windows 版截图模块（screenshot.rs）使用，Android/iOS 走 pal/screenshot.rs 桩，无需编译
#   - rdev：仅被 Windows 版设备监听（device.rs）使用，Android/iOS 走 pal/device.rs 桩，无需编译
# Windows 截图/捕获后端 winapi、windows-capture 已迁移至 [target.'cfg(windows)'.dependencies]，仅 Windows 编译
uuid = { version = "1", features = ["v4"] }
# 原生 Office 文档解析（OOXML = zip + XML），毫秒级、不依赖 Python
zip = "3"
quick-xml = "0.39"
# 原生 PDF 解析（文字 + 图片提取），替代 markitdown
pdf-extract = "0.12"
# pdf-extract 内部使用 lopdf 抽取图片，但对其为私有依赖，这里显式声明以便直接使用
# embed_image 特性提供 xobject::image_from，用于把 OCR 源图写入 PDF
lopdf = { version = "0.42", features = ["embed_image"] }
# 一次性预编译正则（html_to_md 等热路径）
once_cell = "1"
# IDE 内容搜索（命令面板 `#` 模式 / agent grep 工具）：gitignore 感知的并行目录遍历。
# ignore 是 ripgrep 的目录遍历核心（MIT），自动尊重 .gitignore/.ignore/全局 gitignore。
ignore = "0.4"
# Agent glob 工具：文件名 glob 匹配（ignore 的底层库，MIT）；显式声明以便直接使用
globset = "0.4"
# IDE 真 PTY 终端 portable-pty 已迁移至 [target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]，
# 仅桌面编译（原因见该段注释）。
# 统一日志门面：release 默认 warn 级别，dev 开 debug；替代散落的 eprintln!
log = "0.4"
env_logger = "0.11"
# 进程内 ffmpeg 编码器（完整 L0：d3d11va→nvenc 零拷贝）
# libloading 运行时加载 avcodec-*.dll / avformat-*.dll / avutil-*.dll
libloading = "0.8"
# WASAPI Loopback 频谱分析：纯 Rust FFT（MIT），零系统依赖
# 仅用于音频频域分析（1024 点 FFT），极轻量
rustfft = "6"
num-complex = "0.4"

# Windows 任务栏「正在播放」显示名修正：设置本进程 AUMID + 注册表显示名「安得云荟」，
# 使 WebView2/Chromium 注册的媒体会话显示为「安得云荟」而非「未知应用」。
# 注：本环境 windows crate (0.61/0.62) 的 Media_Control 仅生成会话的传输方法，未生成
# Set*（TrySetMediaPropertiesAsync 等）/GetSessionControls 等写入方法，故无法用 Rust 原生
# 任务栏「正在播放」：在 Rust 进程内创建 WinRT SystemMediaTransportControls 会话
# （正确显示名「安得云荟」+ 响应系统媒体键）。需要 Media/Media_Playback（SMTC 类型）
# 与 Win32_System_WinRT（ISystemMediaTransportControlsInterop / RoGetActivationFactory）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_Security",
  # 阶段二（进程内 GPU RGBA→RGBA 缩放）：D3D11 渲染管线 + 运行时 D3DCompile 需要这些 API
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  # 资源占用实时监控：GPU 利用率 % 取自 PDH「GPU Engine」计数器（Utilization Percentage）
  "Win32_System_Performance",
  "Win32_Foundation",
  # 方案 A（原生 WGC 捕获，wgc_native.rs）：帧池建在自建 D3D11 设备上，同设备 GPU 缩放后只读回
  # 小尺寸 RGBA。需要 WinRT Graphics.Capture + DirectX interop + HMONITOR。
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Graphics_Gdi",
  "Media",
  "Media_Playback",
  "Media_Control",
  "Storage_Streams",
] }
# === 以下为 Windows 专属依赖：经 T0 依赖审计后由 [dependencies] 迁入 [target.'cfg(windows)'.dependencies] ===
# 目的：支撑 Android v1 交叉编译（aarch64-linux-android）—— 这些 crate 仅 Windows 有实现，
# 在 Android/Linux/macOS 目标下若仍无条件声明会导致编译失败。迁入后 Windows 构建行为完全不变。
# 桌面端 Windows 独占功能：截图(EnumWindows/PrintWindow/GDI)、WGC 捕获、DoDragDrop 原生拖出、WebView2 COM 透明窗。
drag = "2.1.1"
winapi = { version = "0.3", features = ["winuser", "wingdi", "processthreadsapi", "shellscalingapi", "dwmapi", "winbase", "objbase", "combaseapi", "jobapi2", "objidl", "unknwnbase", "winerror", "ole2", "wtypes", "minwindef", "windef", "guiddef"] }
windows-capture = "2.0"
# WebView2 COM 透明窗：必须与 wry 内部 webview2-com 同版本（0.38），且实现 windows-core 0.61 的 Interface trait
webview2-com-sys = "0.38"
# 高层 WebView2 COM 事件回调（含现成 ProcessFailed/event_callback 等），避免手写 #[implement] 桥的
# windows-core 版本错配；与 webview2-com-sys 同为 0.38 且已在 Cargo.lock（wry 传递依赖），直接复用
webview2-com = "0.38"
windows-core-061 = { package = "windows-core", version = "0.61" }

# WebView2 COM 透明窗相关依赖（webview2-com-sys、windows-core 0.61）已迁移至
# [target.'cfg(windows)'.dependencies]，仅 Windows 编译。说明同上：必须与 wry 内部
# webview2-com 同版本（0.38）且实现 windows-core 0.61 的 Interface trait；待 tauri/wry
# 升级 windows 0.62 后一并移除。**无法统一到 0.62**。

# === 以下为「桌面（非 Android/iOS）」专属依赖：经 T2 依赖审计后由 [dependencies] 迁入 ===
# 目的：支撑 Android v1 交叉编译（aarch64-linux-android）—— arboard / rdev 仅依赖 X11/Wayland/Windows
# 系统 API，在 Android 目标下无实现会导致编译失败。二者仅被 Windows 版 screenshot.rs / device.rs 使用，
# 移动端走 pal/ 同名桩，故在 Android/iOS 下不编译、零功能影响。Windows/桌面 Linux/macOS 构建行为不变。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 跨桌面剪贴板（截图写入兜底），仅 Windows 版 screenshot.rs 使用
arboard = "3"
# 桌宠全局设备监听（鼠标/键盘）：被动全局钩子，仅 Windows 版 device.rs 使用
# 0.5.x 的 listen 接受捕获式 FnMut 闭包（可直接 move AppHandle），更简洁
rdev = "0.5"
# IDE 真 PTY 终端：portable-pty（MIT）跨平台 PTY，Windows 走 ConPTY（Win10 1809+ 内置）。
# 读线程通过 app.emit 推流 pty-output:<id> 事件，前端 xterm.js 监听写入（沙箱屏蔽 WebSocket，故走事件桥接）。
# 迁入原因：portable-pty 0.8 的 Unix 后端经 serial → serial-unix → termios 引入，而 termios 0.2
# 仅实现 linux/macos/freebsd/openbsd，无 android 分支，在 aarch64-linux-android 下必然编译失败
# （E0432/E0433，28 errors）。PTY 终端属 IDE 插件（茑萝/ide）本地终端功能，Android v1 五模块
# （笔记/音乐/视频/图片/传输）不涉及；唯一使用者 services/pty_service.rs 已同步加 cfg 门控，
# 其 4 个 #[tauri::command] 仅在桌面二进制 main.rs 注册，移动端不经过该路径。
# Windows/桌面 Linux/macOS 构建行为完全不变。
portable-pty = "0.8"
# codemode（AI 工具「写一段 JS 循环调工具」）的 JS 引擎：QuickJS 源码随 crate 内置、用 cc 就地编译，
# 零系统依赖、零运行时下载。选它而不是 quickjs-wasi / deno_core 的原因：
#   - 同步解释器 + interrupt handler + 内存/栈上限，正好对上「脚本自己算的时候能被中断」；
#   - 增量约 1MB，deno_core（V8）是 30MB 量级；
#   - 纯 C、MIT，Android 交叉编译只需 NDK 的 clang（cc crate 自动找）。
# 仅桌面编译：AI agent 的 codemode 工具在移动端不注册（见 ai_tools.rs 的 cfg）。
rquickjs = "0.9"

# === Android v1 目标专属依赖（§9.7.2）===
# 仅在 target_os = "android" 下编译；Windows / 桌面 Linux / macOS 构建零影响。
# T01 阶段为空占位——tauri-plugin-android-fs / sharetarget / JNI 桥接相关依赖
# 将在 T03（SAF / fs_bridge）与 T02（组播锁 JNI）按需引入，届时填入此段。
[target.'cfg(target_os = "android")'.dependencies]

[features]
# 攻防模块：默认全开，开箱即用。
# 为什么改成默认全开：此前每次 dev / build 都要手写
# `--features gongfang,gongfang-reverse,gongfang-pentest,gongfang-automation,gongfang-gateway`，
# 极易漏项——两处构建脚本都漏了 gongfang-tls-impersonate，导致发布版静默失去真实 TLS 指纹通道
# （只降级成 UA 档案，前端还如实显示降级，等于功能白做）。现在一律默认启，命令零参数。
# 需要精简二进制时用 `--no-default-features` 显式关掉整组（命令仍注册，走 stub 报错）。
default = [
  "gongfang",                 # 爬虫框架（reqwest 代理池 + 双令牌桶 + EWMA + 隐身 JS）
  "gongfang-reverse",         # 逆向框架（协议文法归纳 + 加密识别 + 内置静态分析/WASM 解析）
  "gongfang-pentest",         # 渗透框架（编码变异 + 载荷库 + 熵指纹 + 攻击拓扑）
  "gongfang-automation",      # 自动化测试（贝塞尔轨迹 + 粉红噪声 + SendInput HID 注入）
  "gongfang-gateway",         # API 网关（代理调度 + 流量整形 + 策略热交换）
  "gongfang-tls-impersonate", # 真实 TLS/JA3-JA4 指纹通道（curl-impersonate 外部进程）
]
# 以下开关默认已在 default 中，单独列出供「显式关掉某个子能力」的精简构建使用
gongfang = ["gongfang-kit/crawler"]
# 攻防 + 浏览器隐身（chromiumoxide 真实浏览器，较重）。
# 故意不进 default：当前唯一使用者 stealth::apply_stealth 无任何调用方，
# 需要 JS 渲染页抓取时优先复用内置 WebView2 通道（browser_open/navigate/sniff）。
gongfang-browser = ["gongfang-kit/crawler-browser"]
gongfang-reverse = ["gongfang-kit/reverse"]
gongfang-pentest = ["gongfang-kit/pentest"]
gongfang-automation = ["gongfang-kit/automation"]
gongfang-gateway = ["gongfang-kit/gateway"]
gongfang-tls-impersonate = ["gongfang-kit/tls-impersonate"]
# 仅供 `cargo test`：把 comctl32 v6 清单链进测试二进制。
#
# 为什么需要：单元测试二进制没有清单，而依赖链里 muda（tauri 菜单）**静态导入**了
# `comctl32.dll!TaskDialogIndirect`——这个导出只存在于 Common-Controls **v6** side-by-side
# 程序集。没有清单 ⇒ 加载器拿 System32 的 v5 ⇒ 进程启动即 0xc0000139，一个测试都跑不了。
#
# 为什么做成 feature 而不是无条件链接：app 二进制已被 tauri-build 内嵌清单，再链一次
# lld 会报 `duplicate resource: type MANIFEST`。cargo 的 `rustc-link-arg-tests` 本机不认
# （见 build.rs 注释），所以只能显式开关。
#
# 用法：`pnpm test:rust`（= cargo test --lib --test smoke --features test-manifest）
test-manifest = []

[profile.dev]
# dev（pnpm tauri dev）默认 opt-level = 0，对录屏这类逐像素/逐帧热点代码慢一个数量级，
# 会让「本地实测」严重失真（实测：同一段 CPU 最近邻+色彩转换在未优化下约 500ms/帧）。
# 故仅对本 crate 提升到 opt-level = 2：热点路径接近 release，而依赖仍按默认 0 编译
# （不触发全量重建，dev 迭代成本几乎不变）。
[profile.dev.package.andeyunhui]
opt-level = 2

[profile.release]
# 全链路优化：跨 crate 内联 + 死代码消除，性能提升 10-20%
lto = true
# 单代码生成单元：允许更激进的内联优化
codegen-units = 1
# 放弃 unwind 表：减小二进制体积约 50%，减少 CPU 分支预测失败
panic = "abort"
# 最高优化等级（3 = 速度优先，s = 体积优先）
opt-level = 3
# 整数溢出检查：debug 默认开启（panic），release 默认关闭（静默回绕）。
# 开启后 dev 与 release 行为一致，避免出现 "dev 正常、release 算出诡异数字" 的难定位 bug；
# 代价是热点数值循环性能下降约 5-10%，但本应用非数值密集型，可接受。
overflow-checks = true
# Android v1 · T01：release 产物 strip 符号（§9.7.2 / F8）。
# 🔴 本段唯一允许的新增项；既有 lto / codegen-units / opt-level / panic / overflow-checks 逐字不动。
strip = true

# Android v1 · X02：cfg 拼写守卫（§9.7.2 / §14.2）。
# 让拼错的 cfg（如缺 target_os= 前缀的 cfg(android) → 恒为真 → 隔离被绕过）
# 在编译期 warn 而非静默通过。check-cfg 列出项目实际使用的自定义 cfg 标识。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)', 'cfg(desktop)'] }

# ============ Linux 专属依赖：SMTC 的 Linux 等价物 MPRIS（D-Bus） ============
# 背景：Windows 的 SMTC（WinRT SystemMediaTransportControls + 会话管理器）是 Windows 专属
# 后端，非 Windows 目标无等价 COM 实现。Linux 桌面的标准是 MPRIS
# （org.mpris.MediaPlayer2.* over D-Bus 会话总线）。
#   - souvlaki：**发布**本应用自己的媒体会话（对齐 Windows 的 SMTC session 注册），
#     使 GNOME 桌面媒体控件能显示/控制本应用的播放，本应用也出现在会话列表里；
#   - mpris：**读取 / 控制**系统上其他播放器（对齐 Windows 的
#     GlobalSystemMediaTransportControlsSessionManager 枚举 + 传输控制）。
# 两者内部都走 libdbus（构建机已具备 dbus-1 1.16.2，pkg-config 可解析）。
# 放在 target_os = "linux" 段：不参与 Windows / Android 构建，对既有平台零影响。
[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.1"
# 发布端自研 MPRIS（替代 souvlaki）：souvlaki 0.8 无法设置 DesktopEntry / Capabilities，
# 也不给 Seek·SetPosition ⇒ GNOME 媒体卡片缺图标、不能拖进度。tokio feature 让底层 zbus
# 复用本应用已有的 tokio 运行时。
mpris-server = { version = "0.10", features = ["tokio"] }
# 拖动通道：应用 → GNOME 扩展（合成器）的 D-Bus 调用
zbus = { version = "5", default-features = false, features = ["tokio"] }
# 点击穿透：tao 的 set_ignore_cursor_events 在 Wayland 上不生效，需直接对 GdkWindow 用
# gdk_window_set_pass_through（GTK3 官方为"整窗穿透"提供的专用 API）
gtk = "0.18"
gdk = "0.18"
# souvlaki 仅保留给非 Linux 平台（macOS 后端）使用
souvlaki = "0.8"
x11 = { version = "2.21.0", features = ["xlib", "xinerama"] }

# ============ Linux 录屏后端（替代 Windows 的 WGC + 进程内 ffmpeg）============
# 背景：Windows 用 windows-capture(WGC) 持续抓帧、进程内 libavcodec 或 ffmpeg.exe 编码。
# Linux 没有 WGC；且本机是 Wayland 会话 —— 纯 X11 抓屏（x11grab）在 Wayland 下拿不到别家窗口。
# 唯一通吃 Wayland/X11 的正路是 **xdg-desktop-portal 的 ScreenCast 接口**（系统授权弹窗 →
# 返回一个 PipeWire 流），再由本进程消费该流、喂 ffmpeg 编码成 MP4。
#   - ashpd：portal 客户端（纯 Rust / zbus，无系统编译期依赖），负责拿 FD + node id；
#   - pipewire：消费 ScreenCast 的 PipeWire 流、按帧读取（**构建期需 libpipewire-0.3-dev**，
#     运行期需系统 libpipewire —— PipeWire 桌面（GNOME/KDE 现代版）默认自带）。
#   - 编码仍走随包分发的 ffmpeg（见 get_ffmpeg_path / DLC），与 Windows 一致的“随包分发”策略。
# 放 target_os = "linux" 段：不参与 Windows/Android 构建，对既有平台零影响。
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pipewire = "0.8"
