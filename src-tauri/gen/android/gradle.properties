android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2560m
org.gradle.caching=true
# Android v1 · T01：Kotlin 编译走 in-process（不启动独立 kotlin daemon）。
# 原因：kotlin daemon 默认写 %LOCALAPPDATA%\kotlin\daemon\，本机 sandbox 阻止该路径写入
# （AccessDeniedException），导致 :tauri-android:compileDebugKotlin 等任务失败。
# in-process 让 Kotlin 编译在 gradle daemon 进程内运行，避免 fork daemon 写受限路径。
# 代价：编译占 gradle daemon 内存（已配 -Xmx2560m，足够）；收益：零 daemon 通信开销、规避 sandbox。
kotlin.compiler.executionStrategy=in-process
# Android v1 · T01：尝试禁用 AAPT2 daemon（走非 daemon 模式）。
# 原因：AAPT2 daemon 通过 stdin/stdout 管道与 aapt2.exe 通信，sandbox 进程隔离可能拦截管道，
# 导致 "AAPT2 Daemon startup failed"（即使 aapt2.exe 手动能跑、UCRT/vcruntime 齐全）。
# 非 daemon 模式每次调用新 aapt2 进程，命令行传参，规避管道通信。
android.aapt2.useDaemon=false
# Android v1 · T01：持久禁用 gradle daemon（等价于每次 --no-daemon）。
# 原因：`npx tauri android build` 内部调 gradlew，无法传 --no-daemon；
# 在 gradle.properties 设 org.gradle.daemon=false 让 tauri 调的 gradle 也走 single-use daemon，
# 规避 AAPT2 daemon 在 IDE sandbox 下 "Process unexpectedly exit"。
# 代价：每次构建 fork single-use daemon（启动慢 ~3s）；收益：规避 sandbox 进程隔离。
org.gradle.daemon=false

# Android v1 · T05：固定 Gradle 使用 JDK 21 便携版，规避 buildSrc 内嵌 Kotlin 的
# JavaVersion.parse 不兼容 JDK 25 的问题（"25.0.4" 抛 IllegalArgumentException）。
# org.gradle.java.home 优先级高于系统 JAVA_HOME —— 仅影响 Android 构建，
# 用户系统的 JDK 25 全局环境不受影响（其他需要 JDK 25 的项目不被破坏）。
# 路径用正斜杠避免 properties 转义；JDK 21 安装于 C:\Users\Rosary\.local\lib\jdk21\
org.gradle.java.home=C:/Users/Rosary/.local/lib/jdk21/jdk-21.0.12+8
