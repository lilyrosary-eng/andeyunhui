[package]
name = "pro-tools-kit"
version = "0.1.0"
edition = "2021"
description = "薄荷模块（专业工具 16 合 1）后端依赖包 —— 以内部 crate 形式独立存在"
authors = ["Rosary"]

[dependencies]
# Tauri 命令宏：#[tauri::command] 需要 tauri 依赖
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# 图片格式转换（t1）
image = "0.25"
base64 = "0.22"
# 进程管理（t14）
sysinfo = "0.30"
# 文档转换（t2）—— html→md 的正则预编译
once_cell = "1"
regex = "1"
pulldown-cmark = "0.12"

# === 以下为「桌面（非 Android/iOS）」专属依赖：经 T2 依赖审计思路补齐 ===
# 目的：支撑 Android v1 交叉编译（aarch64-linux-android）—— arboard 仅依赖 X11/Wayland/Windows
# 系统 API，在 Android 目标下无实现会导致编译失败（arboard-3.6.1 无 Android 后端）。
# 该函数仅被 commands.rs 的剪贴板命令（clipboard_read / clipboard_write /
# clipboard_read_image / clipboard_clear）使用，移动端走同名 PAL 桩（返回 Unsupported），
# 故在 Android/iOS 下不编译、零功能影响。Windows/Linux/macOS 构建行为不变。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 跨桌面剪贴板（仅桌面版剪贴板命令使用）
arboard = "3"
