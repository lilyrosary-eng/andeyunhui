[package]
name = "andeyunhui-updater"
version = "0.1.0"
edition = "2021"
description = "安得云荟 Windows 静默更新助手"

[[bin]]
name = "andeyunhui-updater"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
minisign-verify = "0.3"
semver = "1"
winreg = "0.52"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_RemoteDesktop",
  "Win32_System_TaskScheduler",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }
