[package]
name = "gongfang-kit"
version = "0.1.0"
description = "攻防模块后端内核（双轨制事件溯源 + AI 常驻推理 + 爬虫/逆向/渗透/自动化/网关）"
edition = "2021"

[lib]
name = "gongfang_kit"
path = "src/lib.rs"

# TLS 指纹探针（Phase 1 技术选型 spike，dev-only）：
# 仅在 crawler feature 开启时构建，避免无 crawler 的构建被它牵连失败。
[[bin]]
name = "tls_probe"
path = "src/bin/tls_probe.rs"
required-features = ["crawler"]

# 内置静态分析探针（dev-only）：对真实二进制验证 disasm.rs 的产出与耗时
[[bin]]
name = "disasm_probe"
path = "src/bin/disasm_probe.rs"
required-features = ["reverse"]

[features]
# 默认零重型依赖：仅编译 kernel 骨架 + commands stub，主二进制零污染
default = []
# 启用爬虫框架（reqwest 代理池 + 双令牌桶 + EWMA + CDP 隐身 JS 脚本）
crawler = ["dep:futures-util", "dep:url"]
# 启用浏览器隐身（chromiumoxide 真实浏览器 + CDP 注入，较重，按需开启）
crawler-browser = ["crawler", "dep:chromiumoxide"]
# 启用逆向框架（L*协议文法归纳 + 卡方加密识别 + petgraph 控制流反混淆 + 符号持久化）
# ghidra_headless 外部进程调用 + frida-gum 动态插桩后续阶段接入
# 内置静态分析轨（disasm.rs）：object 解析 PE/ELF/Mach-O + iced-x86 反汇编，二者均 MIT
reverse = ["dep:petgraph", "dep:base64", "dep:object", "dep:iced-x86"]
# 启用渗透框架（编码变异 + SSTI 载荷 + 香农熵指纹 + petgraph 攻击拓扑）
# 替代原计划 6 维度（SMT 求解器/ReDoS fuzzing/JIT Shellcode/FFT 频谱等已删除或降级）
pentest = ["dep:petgraph"]
# 启用自动化测试框架（贝塞尔轨迹 + 粉红噪声 + SendInput HID 注入 + arc-swap 模板热迁移）
# 替代原计划 6 维度（IRL/MPC/uinput/Wasserstein/元学习等已删除或降级）
# Windows 平台自动拉入 winapi（SendInput），非 Windows 平台 hid.rs 不编译
automation = ["dep:winapi"]
# 启用 API 网关（reqwest 代理调度 + EWMA/PID 限流）—— 后续阶段
gateway = []
# 真实 TLS/JA3-JA4 指纹伪装通道（curl-impersonate 外部进程，MIT）。
# 实现落在 crawler/impersonate.rs，故强依赖 crawler：单独开启本 feature 而无 crawler
# 会导致「feature 为真但没有任何链路接入」的不实状态，故在此显式绑定。
# 外部二进制随 external-deps/全局/curl-impersonate/ 分发（Android/lite 构建已排除）。
tls-impersonate = ["crawler"]
# 一键全开
full = ["crawler-browser", "reverse", "pentest", "automation", "gateway"]

[dependencies]
# === 基础（始终编译，极轻量）===
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "process", "fs", "net", "io-util"] }
log = "0.4"
# TLS 后端统一为 rustls（纯 Rust，跨平台、无原生 OpenSSL 依赖）：
# 与 app 的 reqwest 配置保持一致。原默认特性含 native-tls，在 Android/Linux 目标下
# 会拉入 openssl-sys 并要求原生 OpenSSL 库，导致交叉编译失败；Windows 上 native-tls
# 走 schannel 不需要 OpenSSL，故此前 cargo check 能过。改为 rustls-tls 后 Android 交叉
# 编译可行，且 Windows 行为不变（app 侧本就用 rustls）。属 T2「非 Android 依赖门控」修复。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "gzip", "brotli", "deflate"] }
# 无锁策略热交换（ArcSwap）：双轨制核心，亚毫秒级策略切换
arc-swap = "1"
# 无锁 MPMC 队列：用户提示词 @focus/@bypass 抢占式优先级队列
crossbeam-queue = "0.3"
# 异步互斥（比 std::sync::Mutex 更适合 tokio 场景）
parking_lot = "0.12"
once_cell = "1"
chrono = "0.4"

# === crawler feature 依赖 ===
futures-util = { version = "0.3", optional = true }
url = { version = "2", optional = true }
# === crawler-browser feature 依赖（较重，按需）===
chromiumoxide = { version = "0.7", optional = true, default-features = false, features = ["tokio-runtime"] }
# === reverse feature 依赖（轻量图论库，MIT 协议）===
petgraph = { version = "0.6", optional = true, default-features = false }
# === reverse 编码识别解码依赖（MIT）===
base64 = { version = "0.22", optional = true }
# === reverse 内置静态分析依赖（均 MIT，纯 Rust 无原生库）===
# object：PE/ELF/Mach-O 解析（段/符号/导入导出），features=["read","std"] 只取读路径
object = { version = "0.40", optional = true, default-features = false, features = ["read", "std"] }
# iced-x86：x86/x64 反汇编器（含指令流控信息，用于基本块划分）
iced-x86 = { version = "1.21", optional = true, default-features = false, features = ["std", "decoder", "instr_info"] }

# === automation feature 依赖（Windows SendInput HID 注入）===
# 仅 Windows 平台 + automation feature 启用时拉入；非 Windows 平台 hid.rs 不编译
# winapi 是 MIT 协议，winuser feature 仅增加几 KB 头文件绑定，无运行时依赖
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", optional = true, features = ["winuser"] }
