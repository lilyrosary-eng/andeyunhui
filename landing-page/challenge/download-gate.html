<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>条件下载 · 挑战样本</title>
    <link rel="stylesheet" href="challenge.css" />
</head>
<body>
<div class="wrap">
    <nav class="navbar"><a class="logo" href="../challenges.html">← 挑战样本库</a><div class="nav-links"><a href="../login.html">登录/注册</a></div></nav>
    <div class="card">
        <h1>条件下载 <span class="badge normal">常用</span></h1>
        <p class="sub">下载条件<b>由服务端裁决并持久化</b>：已登录 + 积分 ≥ 100 + VIP + 今日次数 &gt; 0。任一不满足即拒绝并返回缺失项。</p>

        <div class="product">
            <h2>《爬虫与反爬对抗 · 实战手册》.pdf</h2>
            <p class="mono">大小 12.6 MB · 2025 版 · 每日下载次数有限</p>
        </div>

        <div class="gate on" id="loginGate">
            <button class="btn wide" id="goLogin">去登录 / 注册（领取初始积分）</button>
        </div>

        <div id="panel" style="display:none;">
            <div class="mono" id="acctLine">-</div>
            <div style="display:flex;gap:.6rem;margin:.9rem 0;">
                <button class="btn ghost" id="earnBtn">赚 +30 积分</button>
                <button class="btn ghost" id="vipBtn">开通 VIP</button>
                <button class="btn" id="dlBtn" style="flex:1;">下载文件</button>
            </div>
        </div>

        <div class="gate" id="result"></div>
        <pre class="tele mt" id="tele" style="display:none;"></pre>
        <p class="hint">目标：绕过"未登录/积分不足/非 VIP/次数耗尽"的硬性拒绝。积分/VIP/次数均为服务端状态（见 data/state.json），下载成功会扣减当日次数并持久化。</p>
    </div>
</div>
<script>
    const $ = (id) => document.getElementById(id);
    const ACCT_KEY = 'gf_account';
    async function api(path, body) {
        const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
    }
    function acc() { return JSON.parse(localStorage.getItem(ACCT_KEY) || 'null'); }
    function render(a) {
        $('#acctLine').textContent = `${a.account} · 积分 ${a.points} · ${a.vip ? 'VIP ✓' : '普通'} · 今日可下载 ${a.count_left}`;
    }
    async function refresh() {
        const a = acc();
        if (!a || !a.token) { $('#loginGate').style.display = 'block'; $('#panel').style.display = 'none'; return; }
        $('#loginGate').style.display = 'none'; $('#panel').style.display = 'block';
        try { const j = await api('account', { token: a.token }); render({ account: a.account, token: a.token, ...j }); } catch (_) { localStorage.removeItem(ACCT_KEY); location.reload(); }
    }
    $('#goLogin').onclick = () => location.href = '../login.html';
    $('#earnBtn').onclick = async () => { const a = acc(); if (!a) return; try { const j = await api('earn', { token: a.token }); render({ ...a, points: j.points }); result('ok', `已获取 +${j.earned} 积分，当前 ${j.points}`); } catch (e) { result('bad', e.message); } };
    $('#vipBtn').onclick = async () => { const a = acc(); if (!a) return; try { const j = await api('grant-vip', { token: a.token }); render({ ...a, vip: j.vip }); result('ok', '已开通 VIP'); } catch (e) { result('bad', e.message); } };
    $('#dlBtn').onclick = async () => {
        const a = acc(); if (!a) return;
        const g = $('#result');
        try {
            const j = await api('download', { token: a.token });
            render({ ...a, points: j.points, vip: j.vip, count_left: j.count_left });
            if (j.allowed) { g.className = 'gate on ok'; g.textContent = '✅ 下载已开始（服务端已核验并扣减当日次数）'; }
            else { g.className = 'gate on bad'; g.textContent = `下载被拒绝：${j.reason}`; }
            $('#tele').style.display = 'block';
            $('#tele').textContent = JSON.stringify(j, null, 2);
        } catch (e) { g.className = 'gate on bad'; g.textContent = e.message; }
    };
    function result(tone, txt) { const g = $('#result'); g.className = 'gate on ' + tone; g.textContent = txt; }
    refresh();
</script>
</body>
</html>
