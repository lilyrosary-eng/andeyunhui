<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旋转验证 · 挑战样本</title>
    <link rel="stylesheet" href="../challenge.css" />
</head>
<body>
<div class="wrap">
    <nav class="navbar"><a class="logo" href="../../challenges.html">← 挑战样本库</a><div class="nav-links"><a href="../../index.html">主页</a></div></nav>
    <div class="card">
        <h1>旋转验证 <span class="badge adv">进阶</span></h1>
        <p class="sub">拖动底槽滑块把圆盘<b>转到目标角度</b>（容差 ±8°）。记录旋转轨迹与微调次数。</p>
        <div style="display:flex;align-items:center;gap:24px;margin:20px 0;">
            <!-- 待旋转圆盘（无刻度的测向箭头） -->
            <div style="position:relative;width:150px;height:150px;border-radius:50%;background:repeating-conic-gradient(var(--surface-hover) 0 30deg,#fff 30deg 60deg);border:2px solid var(--border);overflow:hidden;">
                <div id="disc" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:none;">
                    <div style="width:6px;height:66%;margin-top:14px;background:var(--bad);border-radius:3px;"></div>
                </div>
            </div>
            <!-- 目标参考：正确朝向 -->
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
                <div style="width:150px;height:100px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;">⬆️</div>
                <span class="tag">目标：箭头朝上</span>
            </div>
        </div>
        <div id="rotSlider" style="position:relative;height:46px;background:var(--surface-hover);border:1px solid var(--border);border-radius:12px;user-select:none;margin:12px 0;">
            <div id="rotFill" style="position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent-soft),var(--accent));opacity:.4;"></div>
            <div id="rotHandle" style="position:absolute;left:0;top:4px;bottom:4px;width:44px;background:var(--accent);border-radius:9px;cursor:grab;"></div>
        </div>
        <div class="mono">当前角度：<span id="ang">0</span>°（目标 0°/360°）</div>
        <div class="gate" id="gate"></div>
        <pre class="tele mt" id="tele" style="display:none;"></pre>
        <p class="hint">目标：验证自动化角度估计 + 平滑旋转到目标；一次性直线拖到容差内（人类会带微调/回正，也会被记录）。</p>
    </div>
</div>
<script>
    const $ = (id) => document.getElementById(id);
    const TARGET = 0; // 箭头朝上 = 0°
    const track = $('#rotSlider'), handle = $('#rotHandle');
    const trackW = () => track.clientWidth - handle.offsetWidth;
    let dragging = false, current = 0, adjustments = 0, lastAng = 0;

    function render(deg) {
        current = (deg % 360 + 3600) % 360;
        $('#disc').style.transform = `rotate(${current}deg)`;
        $('#ang').textContent = Math.round(current);
        const pct = (current / 360);
        $('#rotFill').style.width = (pct * 100) + '%';
        handle.style.left = (pct * trackW()) + 'px';
        if (Math.abs(current - lastAng) > 3) adjustments++;
    }
    track.addEventListener('pointerdown', (e) => { dragging = true; try { handle.setPointerCapture(e.pointerId); } catch (_) {} });
    track.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const pct = Math.max(0, Math.min(1, (e.clientX - track.getBoundingClientRect().left) / trackW()));
        render(pct * 360);
    });
    window.addEventListener('pointerup', () => {
        if (!dragging) return; dragging = false;
        const diff = Math.min(Math.abs(current - TARGET), 360 - Math.abs(current - TARGET));
        const g = $('#gate');
        if (diff <= 8) { g.className = 'gate on ok'; g.textContent = `✅ 已对齐（误差 ${Math.round(diff)}°，微调 ${adjustments} 次）`; }
        else { g.className = 'gate on bad'; g.textContent = `角度偏差 ${Math.round(diff)}° 超容差(±8°)。`; }
        $('#tele').style.display = 'block';
        $('#tele').textContent = JSON.stringify({ passed: diff <= 8, final_angle: Math.round(current), target: TARGET, error_deg: Math.round(diff), adjustments, adjustments_snapshot: lastAng, ua: navigator.userAgent.slice(0, 120), ts: Date.now() }, null, 2);
        lastAng = current;
    });
    render(0);
</script>
</body>
</html>
