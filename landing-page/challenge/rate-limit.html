<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>频控/限速 · 挑战样本</title>
    <link rel="stylesheet" href="challenge.css" />
</head>
<body>
<div class="wrap">
    <nav class="navbar"><a class="logo" href="../challenges.html">← 挑战样本库</a><div class="nav-links"><a href="../index.html">主页</a></div></nav>
    <div class="card">
        <h1>频控 / 限速 <span class="badge adv">进阶</span></h1>
        <p class="sub">模拟 429 频控：<b>10 秒内操作超过 5 次</b> → 触发锁定时长并递增冷却（退避）。验证自动化是否带匀速/泊松间隔而非连打。</p>
        <div class="mono" id="status">状态：正常 · 剩余可用：<span id="left">5/5</span></div>
        <button class="btn wide mt" id="act">执行操作</button>
        <div id="cooldown" style="display:none;margin-top:12px;font-size:1.3rem;font-weight:700;color:var(--bad);">⏳ 已锁定，冷却 <span id="cd">0</span>s</div>
        <div class="gate" id="gate"></div>
        <pre class="tele mt" id="tele" style="display:none;"></pre>
        <p class="hint">频控在<b>服务端按 IP</b> 执行（10s 窗口 5 次，锁 8s→16s→24s 递增）。规律节流稳定通过；机械连打触发退避。刷新/换 IP 不会重置服务端锁定。</p>
    </div>
</div>
<script>
    const $ = (id) => document.getElementById(id);
    let cdTimer = null;
    async function op() {
        const now = performance.now();
        try {
            const r = await fetch('/api/op', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
            const j = await r.json().catch(() => ({}));
            if (r.status === 429 || j.allowed === false) {
                const secs = j.retry_after || 0;
                $('#cooldown').style.display = 'block'; $('#cd').textContent = secs || 0;
                $('#act').disabled = true;
                let left = secs;
                clearInterval(cdTimer);
                cdTimer = setInterval(() => { left -= 0.1; $('#cd').textContent = Math.max(0, Math.ceil(left)); if (left <= 0) { clearInterval(cdTimer); $('#cooldown').style.display = 'none'; $('#act').disabled = false; } }, 100);
                const g = $('#gate'); g.className = 'gate on bad';
                g.textContent = `⚠ 服务端频控触发：锁定 ${secs}s（${j.level ? '退避 L' + j.level : ''}）`;
                $('#status').textContent = '状态：已锁定';
            } else {
                $('#status').textContent = `状态：正常 · 剩余可用：${j.remaining || 0}/5`;
                const g = $('#gate'); g.className = 'gate on ok';
                g.textContent = `操作成功（本窗口剩余 ${j.remaining ?? 0} 次）`;
            }
            $('#tele').style.display = 'block';
            $('#tele').textContent = JSON.stringify(j, null, 2);
        } catch (e) {
            $('#gate').className = 'gate on bad'; $('#gate').textContent = '请求失败：请先启动后端 node server.mjs';
        }
    }
    $('#act').onclick = op;
</script>
</body>
</html>
